# Builds the Docker image on every push to main and publishes it to GitHub Container Registry:
#   ghcr.io/<owner>/knight-site:latest  and  :sha-<commit>
# Phala Cloud runs this public image inside a TEE (see docker-compose.phala.yml).
# The image digest printed in the job summary is what the compose file should pin.
name: image
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'docker-compose.phala.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: echo "repo=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/knight-site" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: WITH_VOICE=1
          tags: |
            ${{ steps.meta.outputs.repo }}:latest
            ${{ steps.meta.outputs.repo }}:sha-${{ github.sha }}
      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.repo }}@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
