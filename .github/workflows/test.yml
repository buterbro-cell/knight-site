# Unit tests (input handling, rate limits, attestation and signature checks, no-storage guarantees)
# and offline re-verification of every evidence bundle in evidence/.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Re-verify every evidence bundle offline
        run: for f in evidence/*.json; do echo "== $f"; node scripts/verify-bundle.js "$f"; done
