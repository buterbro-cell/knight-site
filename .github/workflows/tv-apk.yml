name: Android TV app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/tv-apk.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build (Phala TEE and dev server)
        run: |
          gradle -p android assembleDebug --no-daemon
          cp android/app/build/outputs/apk/debug/app-debug.apk secra-tv.apk
          gradle -p android clean assembleDebug --no-daemon -PstartUrl='https://p01--knight-site--gn4xcsxlmt6c.code.run/?tv=1'
          cp android/app/build/outputs/apk/debug/app-debug.apk secra-tv-dev.apk
          sha256sum secra-tv*.apk
      - uses: actions/upload-artifact@v4
        with: { name: secra-tv, path: 'secra-tv*.apk' }
      - name: Publish as the "tv-latest" release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete tv-latest -y --cleanup-tag || true
          gh release create tv-latest secra-tv.apk secra-tv-dev.apk --prerelease --title "SECRA for Android TV" \
            --notes "Sideload on Android TV / Google TV. secra-tv.apk opens the Phala (TEE) deployment, secra-tv-dev.apk the dev server. Built from ${GITHUB_SHA}."
