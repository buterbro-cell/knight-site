<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SECRA — приватный ИИ-агент на NEAR</title>
<meta name="description" content="SECRA — голосовой ИИ-агент на NEAR: отвечает в защищённой среде и платит приватно через NEAR Intents">
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1638">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SECRA">
<script type="importmap">{"imports":{"three":"./3d/vendor/three/build/three.module.min.js","three/addons/":"./3d/vendor/three/examples/jsm/"}}</script>
<style>
  /* 3D SECRA (knight3d.js): replaces pictures and video once loaded */
  .stage.k3d .char{aspect-ratio:702/1060;animation:none!important;touch-action:none}
  .stage.k3d .char img, .stage.k3d .char>canvas:not(.k3d){display:none}
  /* while the 3D model downloads: a soft pulsing glow instead of the old pictures */
  .stage.k3d .char:not(:has(canvas.k3d))::after{content:"";position:absolute;left:50%;bottom:8%;width:46%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
    background:radial-gradient(closest-side,rgba(120,180,255,.35),transparent);animation:k3dload 1.4s ease-in-out infinite}
  @keyframes k3dload{50%{opacity:.35;transform:translateX(-50%) scale(.9)}}
  /* Embedded in a business website (widget.js): room for the close button, no footer text */
  .wbtn{margin-right:6px}.wbtn.on{background:rgba(52,211,153,.16);color:#7ef0c0}
  .pay-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(160,200,255,.12);font-size:14px}.pay-row b{text-align:right;word-break:break-all}
  .pay-priv{margin-top:10px;font-size:12.5px;line-height:1.45;color:#9ff0cf;background:rgba(52,211,153,.1);border-radius:12px;padding:9px 11px}
  .pay-st{margin-top:12px;font-weight:800}
  .pend{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;gap:8px;max-width:calc(100% - 24px);padding:10px 10px 10px 14px;border-radius:16px;background:rgba(8,18,46,.92);border:1px solid rgba(160,200,255,.35);color:#dbe8ff;font-size:14px}
  .pend span{flex:1;min-width:0;overflow-wrap:anywhere}.pend button{flex:none;border:0;border-radius:12px;padding:9px 12px;font:inherit;font-weight:800;background:rgba(255,255,255,.1);color:#fff}.pend button.primary{background:#3b82f6}
  .ibtn{width:32px;padding:0;justify-content:center;font-size:15px}
  .info h3{margin:16px 0 6px;font-size:15px;color:#9fc3ff}.info p,.info li{font-size:14px;line-height:1.45;color:#dbe8ff}.info ul{margin:4px 0;padding-left:18px}
  .info li{margin:3px 0}.info code{font-size:12.5px;background:rgba(255,255,255,.08);border-radius:6px;padding:1px 5px}.info .tag{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px;background:rgba(52,211,153,.18);color:#7ef0c0}
  .info .soon{background:rgba(251,191,36,.18);color:#fcd57a}
  #psheet input{box-sizing:border-box;border:1px solid rgba(160,200,255,.25);border-radius:12px;padding:11px 13px;font:inherit;font-size:16px;background:rgba(255,255,255,.08);color:#fff;outline:none}
  #psheet .pay-row button{padding:6px 10px;flex:none}
  #psheet svg{display:block;width:100%;height:auto}.pay-st a{color:#93c5fd}
  html.embed header{padding-left:46px}
  html.embed #note{display:none}
  .official{display:inline-block;margin-top:3px;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px}
  .official.ok{background:rgba(52,211,153,.18);color:#7ef0c0}
  .official.warn{background:rgba(251,191,36,.18);color:#fcd57a}
  /* bright business rooms (clinic): keep the header readable */
  html.embed header{margin:0 -16px;padding:10px 16px 14px 62px;width:calc(100% + 32px);max-width:none;background:linear-gradient(180deg,rgba(6,12,32,.72),rgba(6,12,32,0))}
</style>
</head>
<body>
<div class="app">
  <div class="bgblur"></div>
  <img class="bgimg" id="bgimg" alt="">
  <div class="shade"></div>
  <div class="stars"></div>
  <header>
    <div class="brand" id="title">SECRA<small id="subtitle">Приватный ИИ на NEAR AI</small></div>
    <div class="hdr-right">
      <button class="vbtn ibtn hidden" id="ibtn" aria-label="About the agent">?</button>
      <button class="vbtn wbtn hidden" id="wbtn" aria-label="Кошелёк"><span id="wtext">Кошелёк</span></button>
      <button class="vbtn wait" id="vbtn" aria-label="Проверка TEE"><span class="dot"></span><span id="vtext">TEE…</span></button>
      <div class="lang" role="group" aria-label="Язык">
        <button data-l="ru" class="on">RU</button><button data-l="en">EN</button>
      </div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="glow" style="opacity:0" id="glow"></div>
    <div class="floor"></div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <button class="bexp" id="bexp" aria-label="Show more" type="button">⌄</button>
    <div class="char" id="char" role="img" aria-label="SECRA">
      <img data-f="idle"  src="img/idle.webp?v=secra2"  alt="" class="show">
      <img data-f="blink" src="img/blink.webp?v=secra2" alt="">
      <img data-f="talk1" src="img/talk1.webp?v=secra2" alt="">
      <img data-f="talk2" src="img/talk2.webp?v=secra2" alt="">
      <img data-f="laugh" src="img/laugh.webp?v=secra2" alt="">
      <img data-f="wave"  src="img/wave.webp?v=secra2"  alt="">
    </div>
  </div>

  <div class="controls">
    <div class="status"><span id="status"></span> <span class="badge" id="demo">ДЕМО</span></div>
    <div class="proof hidden" id="proof"></div>
    <div class="docchip hidden" id="docchip"><span id="docicon">📄</span> <span id="docname"></span><button id="docx" aria-label="Убрать документ">✕</button></div>
    <button class="start" id="start">Поздороваться с SECRA</button>
    <div class="row hidden" id="row">
      <button class="small doc" id="docbtn" aria-label="Загрузить документ">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M12 18v-7M9 14l3-3 3 3"/></svg>
        <span class="lb" id="lbDoc">Документ</span>
      </button>
      <button class="small" id="kbd" aria-label="Написать текстом">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
        <span class="lb" id="lbKbd">Текст</span>
      </button>
      <button class="mic" id="mic" aria-label="Задать вопрос голосом">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </button>
      <button class="small" id="hush" aria-label="Замолчать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
        <span class="lb" id="lbHush">Тише</span>
      </button>
    </div>
    <form class="text" id="form" autocomplete="off">
      <input id="q" maxlength="400" placeholder="Напиши вопрос…" enterkeyhint="send">
      <button type="submit" id="sendBtn">Спросить</button>
    </form>
    <div class="note" id="note"></div>
  </div>
</div>

<!-- Verified panel: attestation checked on the server with a fresh random nonce -->
<div class="modal hidden" id="vmodal"><div class="sheet" id="vsheet"></div></div>
<!-- Private payment card: what the wallet will sign, confirmed by the visitor -->
<div class="modal hidden" id="pmodal"><div class="sheet" id="psheet"></div></div>
<!-- Document picker -->
<div class="modal hidden" id="dmodal"><div class="sheet">
  <h2 id="dTitle">Документ</h2>
  <div class="sub" id="dSub"></div>
  <button class="opt" id="dUpload"><span id="dUploadT"></span><small id="dUploadS"></small></button>
  <h3 id="dSamplesT"></h3>
  <div id="dSamples">
  <button class="opt" data-sample="bank-statement-oct-2026.csv">🏦 Bank statement — October 2026<small>CSV · fictional</small></button>
  <button class="opt" data-sample="receipts-business-trip.txt">🧾 Business trip receipts<small>TXT · fictional</small></button>
  <button class="opt" data-sample="apartment-lease-excerpt.txt">📜 Apartment lease excerpt<small>TXT · fictional</small></button>
  </div>
  <div class="btns"><button id="dClose"></button></div>
  <input type="file" id="dFile" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.txt,.csv,.md,.json,.pdf,text/plain,text/csv,application/pdf" hidden>
</div></div>

<div class="drop hidden" id="drop"><div id="dropT">Отпусти файл — SECRA разберёт</div></div>

<script src="app.js"></script>
</body>
</html>
