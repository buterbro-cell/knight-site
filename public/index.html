<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спроси рыцаря NEAR</title>
<meta name="description" content="Говорящий рыцарь отвечает голосом на вопросы про NEAR, NEAR AI и приватность">
<style>
  :root{
    --bg1:#0b1530; --bg2:#13265a; --accent:#3b82f6; --accent2:#60a5fa;
    --text:#eef4ff; --muted:#9db3df; --bubble:#ffffff; --bubbleText:#14213d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg1);color:var(--text);
    font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  body{overflow:hidden}
  .app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 14px);
    background:radial-gradient(120% 70% at 50% 100%, #1f3f8f 0%, transparent 60%),
               radial-gradient(80% 50% at 50% 0%, #1a2f6b 0%, transparent 70%),
               linear-gradient(180deg,var(--bg1),var(--bg2))}
  .bgimg{position:absolute;left:50%;top:0;transform:translateX(-50%);max-width:none;pointer-events:none;opacity:0;transition:opacity .6s}
  .bgimg.on{opacity:1}
  .bgimg{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
  .bgblur{position:absolute;inset:-40px;background:url(img/bg.webp) center/cover;filter:blur(24px) brightness(.55);opacity:0;transition:opacity .6s;pointer-events:none}
  .app.hasbg .bgblur{opacity:1}
  .shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,12,30,.55) 0%,rgba(6,12,30,0) 22%,rgba(6,12,30,0) 70%,rgba(6,12,30,.65) 86%,#0a1430 100%)}
  .app.hasbg .stars{display:none}
  .stars{position:absolute;inset:0;pointer-events:none;opacity:.55;
    background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 30% 8%,#cfe0ff,transparent),
      radial-gradient(1.5px 1.5px at 78% 14%,#fff,transparent),radial-gradient(1px 1px at 90% 30%,#cfe0ff,transparent),
      radial-gradient(1px 1px at 60% 22%,#fff,transparent),radial-gradient(1.5px 1.5px at 6% 40%,#cfe0ff,transparent),
      radial-gradient(1px 1px at 94% 52%,#fff,transparent),radial-gradient(1px 1px at 45% 5%,#fff,transparent)}
  header{position:relative;width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;padding:12px 0 0}
  .brand{font-weight:800;letter-spacing:.2px;font-size:17px}
  .brand small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:2px}
  .lang{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;font-size:13px;
    padding:6px 11px;border-radius:999px;cursor:pointer}
  .lang button.on{background:var(--accent);color:#fff}

  .stage{position:relative;flex:1;width:100%;max-width:560px;display:flex;align-items:flex-end;justify-content:center;min-height:0}
  .floor{position:absolute;bottom:2%;left:50%;width:62%;height:7%;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(0,0,0,.45),transparent);filter:blur(2px)}
  .glow{position:absolute;bottom:4%;left:50%;width:86%;aspect-ratio:1;transform:translateX(-50%);
    background:radial-gradient(closest-side,rgba(96,165,250,.28),transparent 70%);transition:opacity .4s, transform .4s}
  .stage.listening .glow{opacity:1;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}

  .char{position:relative;height:68%;max-height:560px;aspect-ratio:640/900;margin-bottom:3%;cursor:pointer;
    transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite;user-select:none;-webkit-user-select:none}
  .char img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;visibility:hidden;pointer-events:none;
    -webkit-user-drag:none}
  .char img.show{visibility:visible}
  @keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.008,1.018)}}
  .char.wave{animation:wave .5s ease-in-out infinite alternate}
  @keyframes wave{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
  .char.listen{animation:listen 2.4s ease-in-out infinite}
  @keyframes listen{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-3.5deg) translateY(-4px)}}
  .char.think{animation:think 1.6s ease-in-out infinite}
  @keyframes think{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-1.5deg) translateY(-3px)}}
  .char.talk{animation:talk .9s ease-in-out infinite}
  @keyframes talk{0%,100%{transform:scale(1,1)}50%{transform:scale(1.01,1.025) translateY(-2px)}}
  .char.poke{animation:poke .45s ease-out}
  /* Видео-режим: живая анимация из роликов, без «кукольного» покачивания */
  .char canvas{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .22s ease-out;pointer-events:none}
  .char.video{aspect-ratio:702/1060}
  .char.video img{display:none}
  .char.video, .char.video.wave, .char.video.listen, .char.video.think, .char.video.talk{animation:none}
  .char.video.poke{animation:poke .45s ease-out}
  @keyframes poke{0%{transform:scale(1)}25%{transform:scale(1.06,.93)}55%{transform:scale(.97,1.05)}100%{transform:scale(1)}}

  .bubble{position:absolute;top:2%;left:50%;transform:translateX(-50%) scale(.92);opacity:0;
    width:min(94%,460px);background:rgba(8,18,46,.38);color:#f2f7ff;border-radius:20px;padding:12px 16px;
    border:1px solid rgba(160,200,255,.22);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);
    text-shadow:0 1px 3px rgba(0,0,0,.55);
    font-size:16px;line-height:1.35;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.18);
    transition:opacity .25s, transform .25s;z-index:5;max-height:29%;overflow:auto;scroll-behavior:smooth}
  .bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
  .bubble.user{background:rgba(59,130,246,.30);border-color:rgba(147,197,253,.35);color:#fff;font-weight:600}
  .bubble .dots span{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:#bcd3ff;animation:dot 1s infinite}
  .bubble .dots span:nth-child(2){animation-delay:.15s}.bubble .dots span:nth-child(3){animation-delay:.3s}
  @keyframes dot{50%{transform:translateY(-6px);opacity:.5}}

  .controls{position:relative;width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:6px}
  .status{min-height:20px;font-size:14px;color:var(--muted);font-weight:600;text-align:center}
  .row{display:flex;align-items:center;gap:14px}
  .mic{width:78px;height:78px;border-radius:50%;border:0;cursor:pointer;color:#fff;
    background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 8px 24px rgba(59,130,246,.55), inset 0 -3px 0 rgba(0,0,0,.15);
    display:grid;place-items:center;transition:transform .15s}
  .mic:active{transform:scale(.94)}
  .mic svg{width:34px;height:34px}
  .mic.rec{background:linear-gradient(180deg,#f87171,#ef4444);box-shadow:0 0 0 0 rgba(239,68,68,.6);animation:rec 1.2s infinite}
  @keyframes rec{70%{box-shadow:0 0 0 18px rgba(239,68,68,0)}}
  .mic[disabled]{opacity:.5}
  .small{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.1);color:var(--text);cursor:pointer;display:grid;place-items:center}
  .small svg{width:22px;height:22px}
  .start{border:0;border-radius:999px;padding:16px 26px;font:inherit;font-weight:800;font-size:17px;color:#fff;cursor:pointer;
    background:linear-gradient(180deg,var(--accent2),var(--accent));box-shadow:0 8px 24px rgba(59,130,246,.55);animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  form.text{display:none;width:100%;gap:8px}
  form.text.show{display:flex}
  form.text input{flex:1;min-width:0;border:0;border-radius:999px;padding:14px 18px;font:inherit;font-size:16px;background:rgba(255,255,255,.12);color:#fff;outline:none}
  form.text input::placeholder{color:#8fa4cf}
  form.text button{border:0;border-radius:999px;padding:0 18px;font:inherit;font-weight:800;background:var(--accent);color:#fff;cursor:pointer}
  .note{font-size:11.5px;color:#7f93bf;text-align:center;max-width:460px;line-height:1.35}
  .badge{display:none;font-size:11px;font-weight:800;background:#f59e0b;color:#2b1700;border-radius:999px;padding:3px 9px}
  .badge.show{display:inline-block}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="bgblur"></div>
  <img class="bgimg" id="bgimg" src="img/bg.webp" alt="">
  <div class="shade"></div>
  <div class="stars"></div>
  <header>
    <div class="brand" id="title">Спроси рыцаря NEAR<small id="subtitle">Приватный ИИ на NEAR AI</small></div>
    <div class="lang" role="group" aria-label="Язык">
      <button data-l="ru" class="on">RU</button><button data-l="en">EN</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="glow" style="opacity:0" id="glow"></div>
    <div class="floor"></div>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <div class="char" id="char" role="img" aria-label="Рыцарь">
      <img data-f="idle"  src="img/idle.webp"  alt="" class="show">
      <img data-f="blink" src="img/blink.webp" alt="">
      <img data-f="talk1" src="img/talk1.webp" alt="">
      <img data-f="talk2" src="img/talk2.webp" alt="">
      <img data-f="laugh" src="img/laugh.webp" alt="">
      <img data-f="wave"  src="img/wave.webp"  alt="">
    </div>
  </div>

  <div class="controls">
    <div class="status"><span id="status"></span> <span class="badge" id="demo">ДЕМО</span></div>
    <button class="start" id="start">Поздороваться с рыцарем</button>
    <div class="row hidden" id="row">
      <button class="small" id="kbd" aria-label="Написать текстом">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      </button>
      <button class="mic" id="mic" aria-label="Задать вопрос голосом">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </button>
      <button class="small" id="hush" aria-label="Замолчать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg>
      </button>
    </div>
    <form class="text" id="form" autocomplete="off">
      <input id="q" maxlength="400" placeholder="Напиши вопрос…" enterkeyhint="send">
      <button type="submit" id="sendBtn">Спросить</button>
    </form>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  // ---------------- Тексты ----------------
  const T = {
    ru: {
      title:'Спроси рыцаря NEAR', subtitle:'Приватный ИИ на NEAR AI', start:'Поздороваться с рыцарем',
      hello:'Привет, путник!',
      greetRest:'Я Сэр Ниар, рыцарь NEAR. Нажми на кнопку с микрофоном и спроси меня о чём угодно: про NEAR, приватность или искусственный интеллект!',
      listening:'Слушаю…', thinking:'Думаю…', speaking:'Говорю… (нажми на микрофон, чтобы перебить)',
      ready:'Нажми на микрофон и задай вопрос', placeholder:'Напиши вопрос…', send:'Спросить',
      noHear:'Я ничего не расслышал. Попробуй ещё раз, погромче!',
      micDenied:'Браузер не дал доступ к микрофону. Разреши микрофон в настройках сайта или напиши вопрос текстом.',
      noStt:'Твой браузер не умеет распознавать голос. Напиши вопрос текстом — я отвечу голосом!',
      limitUser:'Уф, ты задал много вопросов! Дай рыцарю передохнуть и возвращайся чуть позже.',
      limitDay:'На сегодня мой запас ответов закончился. Приходи завтра, путник!',
      error:'Мой оракул задумался и не ответил. Спроси ещё раз, пожалуйста.',
      tickle:['Ха-ха-ха! Щекотно!','Эй, осторожнее с доспехами!','Ой! Я рыцарь, а не барабан!','Хи-хи! Ещё раз — и вызову на дуэль!'],
      note:'Голос распознаёт браузер (в Chrome — через Google). Для полной приватности пиши текстом. Ответы генерирует модель в защищённой среде NEAR AI.',
      demoNote:'Демо-режим: ответы заготовлены, микрофон здесь не работает. На настоящем сайте отвечает нейросеть NEAR AI и работает голос.',
      noVoice:'В этом браузере нет голоса — открой сайт в Chrome, чтобы услышать рыцаря',
      searchFiller:'Секунду, сейчас проверю.', searching:'Ищу свежую информацию…',
      speech:'ru-RU'
    },
    en: {
      title:'Ask the NEAR Knight', subtitle:'Private AI powered by NEAR AI', start:'Say hi to the knight',
      hello:'Hello, traveler!',
      greetRest:"I'm Sir Near, the NEAR knight. Tap the microphone and ask me anything about NEAR, privacy or artificial intelligence!",
      listening:'Listening…', thinking:'Thinking…', speaking:'Speaking… (tap the mic to interrupt)',
      ready:'Tap the mic and ask a question', placeholder:'Type a question…', send:'Ask',
      noHear:"I didn't catch that. Try again, a bit louder!",
      micDenied:'The browser blocked the microphone. Allow it in site settings or type your question.',
      noStt:"Your browser can't recognize speech. Type your question and I'll answer out loud!",
      limitUser:"Phew, that's a lot of questions! Let the knight rest and come back a bit later.",
      limitDay:"I'm out of answers for today. Come back tomorrow, traveler!",
      error:"My oracle got lost in thought. Please ask again.",
      tickle:['Ha-ha-ha! That tickles!','Hey, careful with the armor!','Ouch! I am a knight, not a drum!'],
      note:'Speech is recognized by your browser (Chrome uses Google). For full privacy, type instead. Answers come from a model running in NEAR AI secure enclaves.',
      demoNote:'Demo mode: no server connected, answers are pre-written. On the real site NEAR AI answers.',
      noVoice:'No voice in this browser — open the site in Chrome to hear the knight',
      searchFiller:'One moment, let me check.', searching:'Looking up fresh info…',
      speech:'en-US'
    }
  };
  let lang = (navigator.language||'ru').toLowerCase().startsWith('ru') ? 'ru' : 'en';
  try { const s = localStorage.getItem('knight-lang'); if (s) lang = s; } catch(e){}
  const t = k => T[lang][k];

  // ---------------- Элементы ----------------
  const $ = id => document.getElementById(id);
  const charEl=$('char'), bubble=$('bubble'), statusEl=$('status'), stage=$('stage'), glow=$('glow');
  const startBtn=$('start'), row=$('row'), mic=$('mic'), kbd=$('kbd'), hush=$('hush'), form=$('form'), q=$('q');
  const frames={}; charEl.querySelectorAll('img').forEach(i=>frames[i.dataset.f]=i);
  let current='idle';
  function show(f){
    if(VID.on){ VID.want(f==='idle'||f==='blink'?baseClip():'talk'); }
    if(f===current) return; frames[current].classList.remove('show'); frames[f].classList.add('show'); current=f; }

  // ---------------- Живая видео-анимация ----------------
  // Ролики хранят картинку слева и прозрачность справа; WebGL склеивает их в рыцаря без фона.
  const VID=(()=>{
    const api={on:false,want(){}};
    const make=(src,canvas)=>{
      const v=document.createElement('video'); v.src=(v.canPlayType('video/webm; codecs="vp9"')?src+'.webm':src+'.mp4'); v.muted=true; v.loop=true; v.playsInline=true; v.setAttribute('playsinline',''); v.preload='auto'; v.crossOrigin='anonymous';
      const gl=canvas.getContext('webgl',{premultipliedAlpha:true,alpha:true,antialias:false});
      if(!gl) return null;
      const sh=(t,c)=>{const o=gl.createShader(t);gl.shaderSource(o,c);gl.compileShader(o);return o;};
      const pr=gl.createProgram();
      gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 u;void main(){u=vec2((p.x+1.)/2.,(1.-p.y)/2.);gl_Position=vec4(p,0.,1.);}'));
      gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,'precision mediump float;varying vec2 u;uniform sampler2D t;void main(){vec3 c=texture2D(t,vec2(u.x*.5,u.y)).rgb;float a=texture2D(t,vec2(.5+u.x*.5,u.y)).r;gl_FragColor=vec4(c,a);}'));
      gl.linkProgram(pr); gl.useProgram(pr);
      const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      const tex=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,tex);
      [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE));
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      const draw=()=>{
        if(v.readyState<2) return;
        const w=v.videoWidth/2, h=v.videoHeight;
        if(canvas.width!==w){ canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); }
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,v);
        gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      };
      return {v,canvas,draw,ready:new Promise((res,rej)=>{ v.addEventListener('canplaythrough',res,{once:true}); v.addEventListener('error',rej,{once:true}); setTimeout(()=>rej('timeout'),25000); })};
    };
    // Ролики: стоит, говорит, слушает. Добавить новый — положить файлы в vid/ и вписать сюда.
    const C={};
    try{ for(const n of ['idle','talk','listen']){ const cv=document.createElement('canvas'); charEl.appendChild(cv); const o=make('vid/'+n,cv); if(o) C[n]=o; } }catch(e){}
    if(!C.idle||!C.talk) return api;
    // Карта похожих поз: при переключении новый ролик начинается с позы, ближайшей к текущей — без рывка

    if(demo) { await new Promise(r=>setTimeout(r,300)); answer=demoAnswer(question); }
    if(typeof answer==='object' && answer){ // уже озвучивается потоком
      history.push({role:'assistant',content:answer.text});
      if(history.length>12) history.splice(0,history.length-12);
      await answer.done; return;
    }
    history.push({role:'assistant',content:answer});
    if(history.length>12) history.splice(0,history.length-12);
    await speak(answer);
  }
  let askId=0;
  async function streamAnswer(r,myAsk){
    const reader=r.body.getReader(), dec=new TextDecoder();
    const src=makeSource(); src.fullText='';
    let pending='', full='', speaking=null, id=null, searching=false;
    const flush=(final)=>{
      // Режем на фразы: первая — как можно раньше (после первого знака препинания), дальше — по предложениям
      while(true){
        const minLen=src.chunks.length?40:8;
        const m=pending.slice(minLen).search(/[.!?…](\s|$)/);
        if(m<0) break;
        const cut=minLen+m+1; src.push(pending.slice(0,cut)); pending=pending.slice(cut);
      }
      if(!final && pending.length>220){ const c=pending.lastIndexOf(',',200); if(c>40){ src.push(pending.slice(0,c+1)); pending=pending.slice(c+1); } }
      if(final){ src.push(pending); pending=''; }
      if(src.chunks.length && !speaking && myAsk===askId){ id=++speakId; speaking=speak(src,{id}); }
    };
    while(true){
      const {value,done}=await reader.read();
      if(myAsk!==askId){ try{reader.cancel();}catch(e){} break; }
      if(done) break;
      let piece=dec.decode(value,{stream:true});
      if(piece.includes('\u0007')){ // рыцарь пошёл искать информацию
        piece=piece.split('\u0007').join('');
        if(!searching){ searching=true;
          if(!src.chunks.length && !pending.trim()){ const f=t('searchFiller'); full+=f+' '; src.push(f); }
          else { src.push(pending); pending=''; }
          flush(false); setStatus(t('searching'));
        }
      }
      full+=piece; pending+=piece; src.fullText=full;
      if(speaking && id===speakId){ bubble.textContent=full; }
      flush(false);
    }
    flush(true); src.end();
    if(speaking && id===speakId) bubble.textContent=full;
    if(!speaking){ return full.trim()||t('error'); }
    return {text:full.trim(), done:speaking};
  }
  function enableDemo(){ demo=true; $('demo').classList.add('show'); $('note').textContent=t('demoNote'); }

  // Заготовленные ответы для демо-режима (когда нет сервера)
  function demoAnswer(qs){
    const s=qs.toLowerCase(), ru=lang==='ru';
    const has=(...w)=>w.some(x=>s.includes(x));
    if(has('tee','ти и','анклав','enclave','сейф')) return ru?'TEE — это как запечатанный сейф внутри процессора и видеокарты. Даже владелец сервера не может заглянуть внутрь, а железо выдаёт подписанное доказательство, что всё честно. Клянусь своим щитом!':'A TEE is like a sealed safe inside the processor and GPU. Even the server owner cannot look inside, and the hardware signs a proof that everything is legit. On my shield!';
    if(has('приват','privacy','private','данн','видит','sees')) return ru?'В NEAR AI Cloud нейросеть работает внутри защищённой среды TEE: вопросы расшифровываются только внутри неё, и их не видит никто, даже сама NEAR. А проверить это может любой — по криптографической аттестации.':'In NEAR AI Cloud the model runs inside a TEE: your questions are decrypted only inside it, and nobody, not even NEAR, can see them. Anyone can verify this with cryptographic attestation.';
    if(has('intent','интент')) return ru?'NEAR Intents — это когда ты говоришь, что хочешь получить, например обменять биткоин на доллары, а исполнители соревнуются, кто сделает это выгоднее. Работает с десятками блокчейнов.':'With NEAR Intents you say what you want, like swapping bitcoin for dollars, and solvers compete to do it best. It works across dozens of chains.';
    if(has('signature','подпис')) return ru?'Chain Signatures позволяют аккаунту NEAR подписывать транзакции в других сетях: Bitcoin, Ethereum, Solana и не только. Ключ разделён между многими узлами, и ни у одного нет его целиком.':'Chain Signatures let a NEAR account sign transactions on other chains like Bitcoin, Ethereum and Solana. The key is split across many nodes, and no single node holds it.';
    if(has('near','нир','блокчейн','blockchain')) return ru?'NEAR — быстрый блокчейн с шардингом: блоки примерно каждые 0,6 секунды, а финальность около секунды. Адреса там человеческие, вроде alice.near, а комиссии — доли цента.':'NEAR is a fast sharded blockchain: blocks every 0.6 seconds and finality in about a second. Addresses are human-readable like alice.near, and fees are fractions of a cent.';
    if(has('кто ты','тебя зовут','who are you','your name')) return ru?'Я Сэр Ниар, рыцарь NEAR! Охраняю приватность и рассказываю про технологии NEAR простыми словами.':"I'm Sir Near, the NEAR knight! I guard privacy and explain NEAR tech in plain words.";
    if(has('привет','здравств','hello','hi ','hey')) return ru?'И тебе привет, путник! Спроси меня про NEAR, приватность или TEE.':'Hello to you too, traveler! Ask me about NEAR, privacy or TEEs.';
    return ru?'Это демо-версия, тут у меня только заготовки. На настоящем сайте я отвечу на любой вопрос с помощью нейросети NEAR AI. Попробуй спросить про TEE или приватность!':"This is a demo with pre-written answers. On the real site I answer anything using NEAR AI. Try asking about TEEs or privacy!";
  }

  // ---------------- Распознавание голоса ----------------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec=null, recognizing=false, gotFinal=false;
  function startListening(){
    if(!SR){ showText(true); speak(t('noStt')); return; }
    stopSpeaking();
    rec=new SR(); rec.lang=t('speech'); rec.interimResults=true; rec.continuous=false; rec.maxAlternatives=1;
    let finalText='', lastInterim=''; gotFinal=false;
    rec.onstart=()=>{ recognizing=true; mic.classList.add('rec'); setMode('listen'); setStatus(t('listening')); say('…',{user:true}); };
    rec.onresult=e=>{
      let interim='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i]; if(r.isFinal){ finalText+=r[0].transcript; gotFinal=true; } else interim+=r[0].transcript;
      }
      lastInterim=interim;
      say((finalText+interim).trim()||'…',{user:true});
    };
    rec.onerror=e=>{
      if(e.error==='not-allowed'||e.error==='service-not-allowed'){ showText(true); speak(t('micDenied')); }
      else if(e.error==='no-speech'){ speak(t('noHear')); }
    };
    rec.onend=()=>{
      recognizing=false; mic.classList.remove('rec');
      const text=(finalText||lastInterim).trim();
      if(text) ask(text);
      else if(mode==='listen'){ setMode('idle'); hideBubble(); setStatus(t('ready')); }
    };
    try{ rec.start(); }catch(e){ showText(true); }
  }
  function stopListening(){ if(rec&&recognizing) rec.stop(); }

  // ---------------- Кнопки ----------------
  function showText(on){ form.classList.toggle('show',on); if(on) setTimeout(()=>q.focus(),50); }
  mic.addEventListener('click',()=>{ recognizing?stopListening():startListening(); });
  kbd.addEventListener('click',()=>showText(!form.classList.contains('show')));
  hush.addEventListener('click',()=>{ stopSpeaking(); hideBubble(); setStatus(t('ready')); });
  form.addEventListener('submit',e=>{ e.preventDefault(); const v=q.value; q.value=''; ask(v); });

  let tickleIdx=0, started=false;
  charEl.addEventListener('click',()=>{
    if(!started) return begin();
    if(mode!=='idle') return;
    charEl.classList.remove('poke'); void charEl.offsetWidth; charEl.classList.add('poke');
    show('laugh');
    const phrase=T[lang].tickle[tickleIdx++ % T[lang].tickle.length];
    setTimeout(()=>speak(phrase,{face:'laugh'}),250);
  });

  function begin(){
    if(started) return; started=true;
    startBtn.classList.add('hidden'); row.classList.remove('hidden');
    if(!SR) showText(true);
    // Приветствие голосом: на первой фразе машет рукой, дальше говорит
    speak(t('greetRest'),{intro:t('hello')});
  }
  startBtn.addEventListener('click',begin);

  // ---------------- Язык ----------------
  function applyLang(){
    document.documentElement.lang=lang;
    document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
    $('title').firstChild.textContent=t('title'); $('subtitle').textContent=t('subtitle');
    startBtn.textContent=t('start'); q.placeholder=t('placeholder'); $('sendBtn').textContent=t('send');
    $('note').textContent=demo?t('demoNote'):t('note');
    if(started) setStatus(t('ready'));
  }
  document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>{
    lang=b.dataset.l; try{localStorage.setItem('knight-lang',lang);}catch(e){}
    stopSpeaking(); applyLang(); if(!started){ say(t('hello')); }
  }));


  // ---------------- Фон: светящийся круг ровно под ногами рыцаря ----------------
  const bgImg=$('bgimg'), appEl=document.querySelector('.app');
  const RING={x:0.5,y:0.858}; // где на картинке фона находится круг (доли ширины и высоты)
  function layoutBg(){
    if(!bgImg.naturalWidth) return;
    const app=appEl.getBoundingClientRect(), ch=charEl.getBoundingClientRect();
    const W=app.width, iw=bgImg.naturalWidth, ih=bgImg.naturalHeight;
    const feetY=ch.bottom-app.top-ch.height*0.025, feetX=ch.left-app.left+ch.width*0.5;
    const H=app.height;
    let sc=feetY/(ih*RING.y);           // масштаб по высоте: круг всегда одного размера относительно рыцаря
    if(iw*sc<W*0.6) sc=W*0.6/iw;
    const w=iw*sc, h=ih*sc;
    bgImg.style.width=w+'px'; bgImg.style.height=h+'px';
    // если фон уже экрана — края не нужно растворять
    const m=w>W*1.02?'none':''; bgImg.style.webkitMaskImage=m; bgImg.style.maskImage=m;
    bgImg.style.top=(feetY-h*RING.y)+'px';
    bgImg.style.left=(feetX-w*RING.x+w/2)+'px';
  }
  bgImg.addEventListener('load',()=>{ appEl.classList.add('hasbg'); bgImg.classList.add('on'); layoutBg(); });
  if(bgImg.complete && bgImg.naturalWidth){ appEl.classList.add('hasbg'); bgImg.classList.add('on'); }
  window.addEventListener('resize',layoutBg);
  if(window.ResizeObserver) new ResizeObserver(layoutBg).observe(charEl);
  setTimeout(layoutBg,50);

  // ---------------- Старт ----------------
  applyLang();
  // Пока посетитель не нажал кнопку, браузер не разрешает говорить вслух — просто машем и показываем приветствие
  Promise.all(Object.values(frames).map(i=>i.decode?i.decode().catch(()=>{}):0)).then(()=>{
    setMode('wave'); say(t('hello'));
    setTimeout(()=>{ if(!started) setMode('idle'); }, 2600);
  });
  // Проверяем, подключён ли сервер (иначе демо-режим)
  fetch('api/health').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(d=>{ if(!d.ok) throw 0; if(d.tts) serverTTS=d.tts; }).catch(enableDemo);
})();
