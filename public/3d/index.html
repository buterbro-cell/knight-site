<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рыцарь 3D — превью</title>
<style>
  html,body{margin:0;height:100%;background:#0b1530;color:#eef4ff;font-family:ui-rounded,"Segoe UI",system-ui,Roboto,sans-serif;overflow:hidden}
  #bg{position:fixed;inset:0;background:url(../img/bg.webp) center 70%/cover;filter:brightness(.8)}
  canvas#gl{position:fixed;inset:0;width:100%;height:100%}
  .panel{position:fixed;left:0;right:0;bottom:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;
    background:linear-gradient(180deg,transparent,rgba(5,10,30,.85) 30%)}
  .panel button{border:1px solid rgba(160,200,255,.3);background:rgba(13,26,61,.75);color:#fff;font:inherit;font-weight:700;font-size:13px;padding:8px 11px;border-radius:999px;cursor:pointer}
  .panel button.on{background:#3b82f6;border-color:#93c5fd}
  .top{position:fixed;top:10px;left:12px;right:12px;font-weight:800;font-size:15px;text-shadow:0 1px 3px #000}
  .top small{display:block;font-weight:600;color:#9db3df;font-size:12px}
  #load{position:fixed;inset:0;display:grid;place-items:center;font-weight:700;color:#9db3df}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<div id="bg"></div>
<canvas id="gl"></canvas>
<div class="top">Рыцарь 3D — превью<small>Нажимай кнопки: движения, «говорит», моргание. Тапни по рыцарю — он отреагирует.</small></div>
<div id="load">Загружаю 3D-модель…</div>
<div class="panel" id="panel"></div>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

// ---------- Renderer / scene ----------
const canvas=document.getElementById('gl');
const R=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.outputColorSpace=THREE.SRGBColorSpace; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=1.05;
R.shadowMap.enabled=true; R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();
S.environment=new THREE.PMREMGenerator(R).fromScene(new RoomEnvironment(),0.04).texture;
S.add(new THREE.HemisphereLight(0xcfe0ff,0x1a2a55,0.9));
const key=new THREE.DirectionalLight(0xffffff,2.2); key.position.set(1.5,3,2.5); key.castShadow=true; key.shadow.mapSize.set(1024,1024);
key.shadow.camera.left=-1.5;key.shadow.camera.right=1.5;key.shadow.camera.top=2.5;key.shadow.camera.bottom=-0.5; S.add(key);
const rim=new THREE.DirectionalLight(0x7fb4ff,1.6); rim.position.set(-2,2,-2); S.add(rim);
const floor=new THREE.Mesh(new THREE.CircleGeometry(1.2,48),new THREE.ShadowMaterial({opacity:.35})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; S.add(floor);
const C=new THREE.PerspectiveCamera(28,1,0.05,50);
function resize(){ const w=innerWidth,h=innerHeight; R.setSize(w,h,false); C.aspect=w/h; const fit=w/h<0.7?5.6:4.6; C.position.set(0,1.05,fit); C.lookAt(0,0.82,0); C.updateProjectionMatrix(); }
addEventListener('resize',resize); resize();

// ---------- Load ----------
const L=new GLTFLoader();
const [K,SW,SH]=await Promise.all(['knight','sword','shield'].map(n=>L.loadAsync('models/'+n+'.glb')));
document.getElementById('load').remove();
const knight=K.scene; S.add(knight);
const bone=n=>{ let b=null; knight.traverse(o=>{ if(o.name===n) b=o; }); return b; };

// Shiny armor: grey/white texels become metal, blue stays soft
function metalize(root){
  root.traverse(o=>{
    if(!o.isMesh) return; o.castShadow=true; o.frustumCulled=false;
    const m=o.material; if(!m||!m.map||!m.map.image) return;
    const img=m.map.image, cv=document.createElement('canvas'); const W=cv.width=Math.min(img.width,512), H=cv.height=Math.min(img.height,512);
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0,W,H); const d=cx.getImageData(0,0,W,H); const p=d.data;
    for(let i=0;i<p.length;i+=4){ const r=p[i],g=p[i+1],b=p[i+2], mx=Math.max(r,g,b), mn=Math.min(r,g,b), sat=mx?(mx-mn)/mx:0;
      const metal=sat<0.18&&mx>60?235:0; p[i]=0; p[i+1]=metal?70:150; p[i+2]=metal; p[i+3]=255; }
    cx.putImageData(d,0,0); const t=new THREE.CanvasTexture(cv); t.flipY=m.map.flipY; t.colorSpace=THREE.NoColorSpace;
    m.metalnessMap=t; m.roughnessMap=t; m.metalness=1; m.roughness=1; m.envMapIntensity=1.3; m.needsUpdate=true;
  });
}
[knight,SW.scene,SH.scene].forEach(metalize);

// ---------- Animations ----------
const mixer=new THREE.AnimationMixer(knight);
const clips=Object.fromEntries(K.animations.map(c=>[c.name,c]));
const IDLE=clips['Idle']?'Idle':'Combat_Stance';
// Calibrate weapon grip on the idle pose, then they follow the hands in every animation
const calib=mixer.clipAction(clips[IDLE]); calib.play(); mixer.setTime(0); knight.updateMatrixWorld(true);
function attach(item,boneName,grip,worldEulerDeg,scale,offset=[0,0,0]){
  const m=item.scene, b=bone(boneName); if(!b) return;
  const wq=new THREE.Quaternion().setFromEuler(new THREE.Euler(...worldEulerDeg.map(x=>x*Math.PI/180)));
  const bq=b.getWorldQuaternion(new THREE.Quaternion()), bs=b.getWorldScale(new THREE.Vector3());
  m.quaternion.copy(bq.clone().invert().multiply(wq)); m.scale.setScalar(scale/bs.x);
  const gw=new THREE.Vector3(...grip).multiplyScalar(scale).applyQuaternion(wq).negate().add(new THREE.Vector3(...offset));
  m.position.copy(gw.applyQuaternion(bq.clone().invert()).divide(bs)); b.add(m);
}
attach(SW,'Bone_036',[0,-0.36,0],[0,0,0],0.95);
attach(SH,'Bone_035',[0,0,-0.03],[0,0,0],0.72);
calib.stop();

// ---------- Face: drawn eyes and mouth on a curved patch fixed to the head bone ----------
const FW=512, FH=384, face=document.createElement('canvas'); face.width=FW; face.height=FH; const fx=face.getContext('2d');
const faceTex=new THREE.CanvasTexture(face); faceTex.colorSpace=THREE.SRGBColorSpace;
let eyes='open', mouth='closed';
// Your own drawings: put PNGs (1000x600, transparent, drawn over face-template.png) into public/3d/face/ — they replace the drawn ones.
// eyes_open / eyes_closed / eyes_happy, mouth_closed / mouth_mid / mouth_wide / mouth_o
const ART={};
await Promise.all(['eyes_open','eyes_closed','eyes_happy','mouth_closed','mouth_mid','mouth_wide','mouth_o'].map(n=>new Promise(r=>{
  const im=new Image(); im.onload=()=>{ ART[n]=im; r(); }; im.onerror=()=>r(); im.src='face/'+n+'.png?v=1'; })));
function drawFace(){
  fx.clearRect(0,0,FW,FH);
  if(ART['eyes_'+eyes]||ART['mouth_'+mouth]){
    const e=ART['eyes_'+eyes]||ART.eyes_open, m=ART['mouth_'+mouth]||ART.mouth_closed;
    if(e) fx.drawImage(e,0,0,FW,FH); if(m) fx.drawImage(m,0,0,FW,FH);
    faceTex.needsUpdate=true; return;
  }
  const eye=(x)=>{ const y=150;
    if(eyes==='closed'){ fx.strokeStyle='#0b0f1a'; fx.lineWidth=14; fx.lineCap='round'; fx.beginPath(); fx.arc(x,y+10,48,Math.PI*1.12,Math.PI*1.88); fx.stroke(); return; }
    if(eyes==='happy'){ fx.strokeStyle='#0b0f1a'; fx.lineWidth=14; fx.lineCap='round'; fx.beginPath(); fx.arc(x,y+30,48,Math.PI*1.15,Math.PI*1.85); fx.stroke(); return; }
    fx.fillStyle='#fff'; fx.beginPath(); fx.ellipse(x,y,66,74,0,0,Math.PI*2); fx.fill();
    fx.fillStyle='#0b0f1a'; fx.beginPath(); fx.ellipse(x,y+4,56,64,0,0,Math.PI*2); fx.fill();
    fx.fillStyle='#fff'; fx.beginPath(); fx.ellipse(x+18,y-22,18,20,0,0,Math.PI*2); fx.fill();
    fx.beginPath(); fx.ellipse(x-18,y+26,8,9,0,0,Math.PI*2); fx.fill();
  };
  eye(150); eye(362);
  const my=270, mx=FW/2;
  fx.strokeStyle='#0b0f1a'; fx.lineWidth=9; fx.lineCap='round'; fx.lineJoin='round';
  if(mouth==='closed'){ fx.beginPath(); fx.arc(mx-18,my,18,0.1*Math.PI,0.9*Math.PI); fx.stroke(); fx.beginPath(); fx.arc(mx+18,my,18,0.1*Math.PI,0.9*Math.PI); fx.stroke(); }
  else{ const h=mouth==='wide'?46:mouth==='mid'?30:16, w=mouth==='wide'?52:mouth==='o'?24:40;
    fx.fillStyle='#3a0f17'; fx.beginPath(); fx.ellipse(mx,my+h*0.35,w,h,0,0,Math.PI*2); fx.fill();
    fx.fillStyle='#ff7a93'; fx.beginPath(); fx.ellipse(mx,my+h*0.35+h*0.45,w*0.6,h*0.45,0,0,Math.PI*2); fx.fill();
    fx.lineWidth=7; fx.beginPath(); fx.ellipse(mx,my+h*0.35,w,h,0,0,Math.PI*2); fx.stroke(); }
  faceTex.needsUpdate=true;
}
drawFace();
const DBG=new URLSearchParams(location.search); const dn=(k,v)=>+(DBG.get(k)??v);
const hf=bone('headfront');
if(hf){
  const geo=new THREE.PlaneGeometry(dn('fw',0.6),dn('fw',0.6)*0.75,24,18); const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i), y=pos.getY(i); pos.setZ(i,-(x*x)*dn('cx',1.25)-(y*y)*dn('cy',0.9)); }   // follow the round face
  const patch=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({map:faceTex,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4}));
  const s=hf.getWorldScale(new THREE.Vector3()); patch.scale.divide(s); patch.position.set(0,dn('fy',0.18)/s.y,dn('fz',0.06)/s.z); patch.renderOrder=2;
  hf.add(patch);
  if(DBG.get('template')){   // ?template=1&pose=rest — front close-up of the face area, for drawing your own eyes/mouth
    patch.visible=false; knight.updateMatrixWorld(true);
    const c=patch.localToWorld(new THREE.Vector3(0,0,0)), n=new THREE.Vector3(0,0,1).transformDirection(patch.matrixWorld);
    C.fov=20; C.aspect=innerWidth/innerHeight; C.position.copy(c).addScaledVector(n,2.6); C.lookAt(c); C.updateProjectionMatrix();
    const pts=[]; const pa=geo.attributes.position; for(const [x,y] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ const w=dn('fw',0.6)/2*x, h=dn('fw',0.6)*0.375*y;
      const v=patch.localToWorld(new THREE.Vector3(w,h,0)).project(C); pts.push([(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight]); }
    window.__bbox=pts; addEventListener('resize',e=>e.stopImmediatePropagation(),true);
  }
}
// blinking
(function blink(){ setTimeout(()=>{ if(eyes==='open'){ eyes='closed'; drawFace(); setTimeout(()=>{ eyes='open'; drawFace(); },130); } blink(); },2000+Math.random()*3500); })();

// ---------- Playback ----------
let current=null;
function play(name,{once=false,speed=1}={}){
  const clip=clips[name]; if(!clip) return;
  const a=mixer.clipAction(clip); a.reset(); a.setEffectiveTimeScale(speed); a.setLoop(once?THREE.LoopOnce:THREE.LoopRepeat); a.clampWhenFinished=once;
  if(current&&current!==a) a.crossFadeFrom(current,0.35,true); a.play(); current=a;
  if(once){ const back=e=>{ if(e.action===a){ mixer.removeEventListener('finished',back); play(IDLE,{speed:0.8}); } }; mixer.addEventListener('finished',back); }
}
if(DBG.get('pose')!=='rest') play(IDLE,{speed:0.8});

// talking test: mouth shapes + gentle head nods
let talking=false, talkT=0;
const head=bone('mixamorig:Head');
function setTalking(on){ talking=on; if(!on){ mouth='closed'; drawFace(); } }

// tap → laugh-ish reaction
canvas.addEventListener('click',()=>{ eyes='happy'; mouth='wide'; drawFace(); setTimeout(()=>{ eyes='open'; mouth='closed'; drawFace(); },900); });

// ---------- UI ----------
const panel=document.getElementById('panel');
const btn=(label,fn)=>{ const b=document.createElement('button'); b.textContent=label; b.onclick=()=>fn(b); panel.appendChild(b); return b; };
const tb=btn('🗣️ Говорит',b=>{ setTalking(!talking); b.classList.toggle('on',talking); });
btn('😊 Радость',()=>{ eyes='happy'; mouth='wide'; drawFace(); setTimeout(()=>{ eyes='open'; mouth='closed'; drawFace(); },1200); });
for(const name of Object.keys(clips)) btn(name.replace(/_/g,' '),()=>play(name,{once:name!==IDLE,speed:name===IDLE?0.8:1}));

// ---------- Loop ----------
const clock=new THREE.Clock();
R.setAnimationLoop(()=>{ if(DBG.get('template')){ R.render(S,C); window.__ready=1; R.setAnimationLoop(null); return; }
  const dt=Math.min(clock.getDelta(),0.05); mixer.update(dt);
  if(talking){ talkT+=dt; if(talkT>0.09+Math.random()*0.07){ talkT=0; const r=Math.random(); mouth=r<0.35?'wide':r<0.7?'mid':r<0.85?'o':'closed'; drawFace(); }
    if(head){ head.rotation.x+=Math.sin(performance.now()/180)*0.04; head.rotation.z+=Math.sin(performance.now()/330)*0.03; } }
  R.render(S,C);
});
</script>
</body>
</html>
