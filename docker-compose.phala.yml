# Phala Cloud (dstack) deployment: the whole relay server runs inside an Intel TDX confidential VM.
# Paste this into Phala Cloud → Deploy → Docker Compose. Set NEAR_AI_KEY, DEV_KEY and ONECLICK_JWT as encrypted secrets.
# UPDATE THE EXISTING APP IN PLACE — never re-create it: agent wallet keys are derived from this app's TEE identity.
# For full verifiability pin the image by digest (see the GitHub Actions "image" job summary):
#   image: ghcr.io/buterbro-cell/knight-site@sha256:b765189f64f97764039c9b6783906cebe27cfcf32143fc4d8102c3b714bee481<digest>
services:
  app:
    # built by GitHub Actions from commit 0fb8d26
    image: ghcr.io/buterbro-cell/knight-site@sha256:b765189f64f97764039c9b6783906cebe27cfcf32143fc4d8102c3b714bee481
    restart: always
    user: root          # the dstack socket belongs to root inside the CVM
    ports:
      - "3000:3000"
    environment:
      - NEAR_AI_KEY=${NEAR_AI_KEY}
      - DEV_KEY=${DEV_KEY}
      # NEAR Intents partner key (1Click) for private payments; set as an encrypted secret. NEVER set AGENT_DEV_SEED here:
      # on Phala the agent keys come from the TEE (dstack GetKey).
      - ONECLICK_JWT=${ONECLICK_JWT}
      - TRUST_PROXY=1
    volumes:
      # dstack guest agent: lets the app request Intel TDX quotes about itself (lib/selfattest.js)
      - /var/run/dstack.sock:/var/run/dstack.sock
      # encrypted standing orders (DCA) — the only data at rest, key from the TEE (lib/dca.js)
      - orders:/app/data
volumes:
  orders:
